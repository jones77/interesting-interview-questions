- short_name: fizzbuzz
  title: Fizz Buzz
  difficulty: easy
  category: general
  frequency: common
  signature: fizzBuzz(n int) []string
  url: https://leetcode.com/problems/fizz-buzz/
  question_text: |
    Given an integer `n`, return a string array `answer` (1-indexed) where:

    - `answer[i] == "FizzBuzz"` if `i` is divisible by 3 and 5.
    - `answer[i] == "Fizz"` if `i` is divisible by 3.
    - `answer[i] == "Buzz"` if `i` is divisible by 5.
    - `answer[i] == i` (as a string) otherwise.

    **Example 1:**

    ```
    Input: n = 3
    Output: ["1","2","Fizz"]
    ```

    **Example 2:**

    ```
    Input: n = 5
    Output: ["1","2","Fizz","4","Buzz"]
    ```

    **Example 3:**

    ```
    Input: n = 15
    Output: ["1","2","Fizz","4","Buzz","Fizz","7","8","Fizz","Buzz","11","Fizz","13","14","FizzBuzz"]
    ```

    **Constraints:**

    - `1 <= n <= 10^4`
  solution: |
    func fizzBuzz(n int) []string {
        ans := make([]string, n)
        for i := 1; i <= n; i++ {
            switch {
            case i%15 == 0:
                ans[i-1] = "FizzBuzz"
            case i%3 == 0:
                ans[i-1] = "Fizz"
            case i%5 == 0:
                ans[i-1] = "Buzz"
            default:
                ans[i-1] = strconv.Itoa(i)
            }
        }
        return ans
    }
- short_name: happy-number
  title: Happy Number
  difficulty: easy
  category: math
  frequency: uncommon
  signature: isHappy(n int) bool
  url: https://leetcode.com/problems/happy-number/
  question_text: |
    A happy number is a number defined by the following process:
    Starting with any positive integer, replace the number by the sum of
    the squares of its digits, and repeat until the number equals 1, or
    it loops endlessly in a cycle that does not include 1. Return true
    if the number is happy.

    **Example 1:**

    ```
    Input: n = 19
    Output: true
    Explanation: 1² + 9² = 82, 8² + 2² = 68, 6² + 8² = 100, 1² + 0² + 0² = 1
    ```

    **Example 2:**

    ```
    Input: n = 2
    Output: false
    ```

    **Constraints:**

    - `1 <= n <= 2³¹ - 1`
  solution: |
    func isHappy(n int) bool {
        seen := map[int]bool{}
        for n != 1 && !seen[n] {
            seen[n] = true
            sum := 0
            for x := n; x > 0; x /= 10 {
                d := x % 10
                sum += d * d
            }
            n = sum
        }
        return n == 1
    }
- short_name: reverse-string
  title: Reverse String
  difficulty: easy
  category: strings
  frequency: common
  signature: reverseString(s []byte)
  url: https://leetcode.com/problems/reverse-string/
  question_text: |
    Write a function that reverses a string. The input string is given as an array of characters `s`.

    You must do this by modifying the input array in-place with O(1) extra memory.

    **Example 1:**

    ```
    Input: s = ["h","e","l","l","o"]
    Output: ["o","l","l","e","h"]
    ```

    **Example 2:**

    ```
    Input: s = ["H","a","n","n","a","h"]
    Output: ["h","a","n","n","a","H"]
    ```

    **Constraints:**

    - `1 <= s.length <= 10^5`
    - `s[i]` is a printable ascii character.
  solution: |
    func reverseString(s []byte) {
        for i, j := 0, len(s)-1; i < j; i, j = i+1, j-1 {
            s[i], s[j] = s[j], s[i]
        }
    }
- short_name: two-sum
  title: Two Sum
  difficulty: easy
  category: arrays
  frequency: common
  signature: twoSum(nums []int, target int) []int
  url: https://leetcode.com/problems/two-sum/
  question_text: |
    Given an array of integers `nums` and an integer `target`, return indices of the two numbers that add up to `target`.

    You may assume that each input has exactly one solution, and you may not use the same element twice.

    You can return the answer in any order.

    **Example 1:**

    ```
    Input: nums = [2,7,11,15], target = 9
    Output: [0,1]
    Explanation: Because nums[0] + nums[1] == 9, we return [0, 1].
    ```

    **Example 2:**

    ```
    Input: nums = [3,2,4], target = 6
    Output: [1,2]
    ```

    **Example 3:**

    ```
    Input: nums = [3,3], target = 6
    Output: [0,1]
    ```

    **Constraints:**

    - `2 <= nums.length <= 10^4`
    - `-10^9 <= nums[i] <= 10^9`
    - `-10^9 <= target <= 10^9`
    - Only one valid answer exists.

    **Follow-up:** Can you come up with an algorithm that is less than O(n²) time complexity?
  solution: |
    func twoSum(nums []int, target int) []int {
        m := make(map[int]int)
        for i, v := range nums {
            if j, ok := m[target-v]; ok {
                return []int{j, i}
            }
            m[v] = i
        }
        return nil
    }
- short_name: count-smaller-numbers-after-self
  title: Count of Smaller Numbers After Self
  difficulty: expert
  category: arrays
  frequency: rare
  signature: countSmaller(nums []int) []int
  url: https://leetcode.com/problems/count-of-smaller-numbers-after-self/
  question_text: |
    Given an integer array `nums`, return an integer array `counts` where
    `counts[i]` is the number of smaller elements to the right of `nums[i]`.

    **Example 1:**

    ```
    Input: nums = [5,2,6,1]
    Output: [2,1,1,0]
    Explanation:
    - 5 has 2 smaller: 2 and 1
    - 2 has 1 smaller: 1
    - 6 has 1 smaller: 1
    - 1 has 0 smaller
    ```

    **Example 2:**

    ```
    Input: nums = [-1,-1]
    Output: [0,0]
    ```

    **Constraints:**

    - `1 <= nums.length <= 10^5`
    - `-10^4 <= nums[i] <= 10^4`
  solution: |
    type fenwick struct {
        tree []int
    }

    func (f *fenwick) add(i int) {
        for i < len(f.tree) {
            f.tree[i]++
            i += i & -i
        }
    }

    func (f *fenwick) sum(i int) int {
        s := 0
        for i > 0 {
            s += f.tree[i]
            i -= i & -i
        }
        return s
    }

    func countSmaller(nums []int) []int {
      if len(nums) == 0 {
          return []int{}
      }
        min, max := nums[0], nums[0]
        for _, v := range nums {
            if v < min {
                min = v
            }
            if v > max {
                max = v
            }
        }
        offset := 1 - min
        size := max - min + 2
        bit := &fenwick{tree: make([]int, size)}
        ans := make([]int, len(nums))
        for i := len(nums) - 1; i >= 0; i-- {
            idx := nums[i] + offset
            ans[i] = bit.sum(idx - 1)
            bit.add(idx)
        }
        return ans
    }
- short_name: alien-dictionary
  title: Alien Dictionary
  difficulty: hard
  category: graph
  frequency: uncommon
  signature: alienOrder(words []string) string
  url: https://leetcode.com/problems/alien-dictionary/
  question_text: |
    There is a new alien language which uses the Latin alphabet. The order
    of letters is unknown to you. You receive a list of non-empty words
    from the alien dictionary, sorted lexicographically by the rules of
    this new language. Derive the order of letters in this language.
    If the order is invalid, return an empty string.

    **Example 1:**

    ```
    Input: words = ["wrt","wrf","er","ett","rftt"]
    Output: "wertf"
    ```

    **Example 2:**

    ```
    Input: words = ["z","x","z"]
    Output: ""
    ```

    **Constraints:**

    - `1 <= words.length <= 100`
    - `1 <= words[i].length <= 100`
    - `words[i]` consists of only lowercase English letters
  solution: |
    func alienOrder(words []string) string {
        adj := map[byte][]byte{}
        in := map[byte]int{}
        for _, w := range words {
            for i := 0; i < len(w); i++ {
                adj[w[i]] = adj[w[i]]
                in[w[i]] = in[w[i]]
            }
        }
        for i := 0; i < len(words)-1; i++ {
            a, b := words[i], words[i+1]
            minLen := len(a)
            if len(b) < minLen {
                minLen = len(b)
            }
            if len(a) > len(b) && a[:minLen] == b[:minLen] {
                return ""
            }
            for j := 0; j < minLen; j++ {
                if a[j] != b[j] {
                    adj[a[j]] = append(adj[a[j]], b[j])
                    in[b[j]]++
                    break
                }
            }
        }
        q := make([]byte, 0)
        for c := range adj {
            if in[c] == 0 {
                q = append(q, c)
            }
        }
        var order []byte
        for len(q) > 0 {
            c := q[0]
            q = q[1:]
            order = append(order, c)
            for _, n := range adj[c] {
                in[n]--
                if in[n] == 0 {
                    q = append(q, n)
                }
            }
        }
        if len(order) != len(adj) {
            return ""
        }
        return string(order)
    }
- short_name: binary-tree-maximum-path-sum
  title: Binary Tree Maximum Path Sum
  difficulty: hard
  category: trees
  frequency: common
  kind: max-path-tree
  url: https://leetcode.com/problems/binary-tree-maximum-path-sum/
  question_text: |
    A path in a binary tree is a sequence of nodes where each pair of
    adjacent nodes in the sequence has an edge connecting them. A node
    can only appear in the sequence at most once. The path sum is the
    sum of the node values in the path. Given the root of a binary tree,
    return the maximum path sum of any non-empty path.

    **Example 1:**

    ```
    Input: root = [1,2,3]
    Output: 6
    Explanation: 2 → 1 → 3
    ```

    **Example 2:**

    ```
    Input: root = [-10,9,20,null,null,15,7]
    Output: 42
    Explanation: 15 → 20 → 7
    ```

    **Constraints:**

    - The number of nodes in the tree is in the range `[1, 3 * 10^4]`.
    - `-1000 <= Node.val <= 1000`
  solution: |
    func maxPathSum(root *TreeNode) int {
        maxSum := root.Val
        var dfs func(*TreeNode) int
        dfs = func(n *TreeNode) int {
            if n == nil {
                return 0
            }
            left := max(dfs(n.Left), 0)
            right := max(dfs(n.Right), 0)
            cur := n.Val + left + right
            if cur > maxSum {
                maxSum = cur
            }
            return n.Val + max(left, right)
        }
        dfs(root)
        return maxSum
    }

    func max(a, b int) int {
        if a > b {
            return a
        }
        return b
    }
- short_name: burst-balloons
  title: Burst Balloons
  difficulty: hard
  category: dynamic-programming
  frequency: uncommon
  signature: maxCoins(nums []int) int
  url: https://leetcode.com/problems/burst-balloons/
  question_text: |
    You are given `n` balloons, indexed from `0` to `n - 1`. Each balloon is
    painted with a number on it represented by an array `nums`. You are
    asked to burst all the balloons. If you burst the i-th balloon, you
    get `nums[i - 1] * nums[i] * nums[i + 1]` coins. After bursting `i`,
    `i - 1` and `i + 1` become adjacent. Return the maximum coins you can
    collect by bursting the balloons wisely.

    You may imagine `nums[-1] = nums[n] = 1`. They are not real, you
    cannot burst them.

    **Example 1:**

    ```
    Input: nums = [3,1,5,8]
    Output: 167
    Explanation:
    nums = [3,1,5,8] → [3,5,8] → [3,8] → [8] → []
    coins = 3*1*5 + 3*5*8 + 1*3*8 + 1*8*1 = 167
    ```

    **Example 2:**

    ```
    Input: nums = [1,5]
    Output: 10
    ```

    **Constraints:**

    - `n == nums.length`
    - `1 <= n <= 300`
    - `0 <= nums[i] <= 100`
  solution: |
    func maxCoins(nums []int) int {
        n := len(nums)
        vals := make([]int, n+2)
        vals[0], vals[n+1] = 1, 1
        for i := 1; i <= n; i++ {
            vals[i] = nums[i-1]
        }
        dp := make([][]int, n+2)
        for i := range dp {
            dp[i] = make([]int, n+2)
        }
        for length := 1; length <= n; length++ {
            for l := 1; l <= n-length+1; l++ {
                r := l + length - 1
                for k := l; k <= r; k++ {
                    coins := vals[l-1] * vals[k] * vals[r+1]
                    coins += dp[l][k-1] + dp[k+1][r]
                    if coins > dp[l][r] {
                        dp[l][r] = coins
                    }
                }
            }
        }
        return dp[1][n]
    }
- short_name: longest-increasing-path-matrix
  title: Longest Increasing Path in a Matrix
  difficulty: hard
  category: matrix
  frequency: uncommon
  signature: longestIncreasingPath(matrix [][]int) int
  url: https://leetcode.com/problems/longest-increasing-path-in-a-matrix/
  question_text: |
    Given an `m x n` integers matrix, return the length of the longest
    increasing path in the matrix. From each cell, you can move in four
    directions: left, right, up, or down. You may not move diagonally
    or outside the boundary.

    **Example 1:**

    ```
    Input: matrix = [[9,9,4],[6,6,8],[2,1,1]]
    Output: 4
    Explanation: 1 → 2 → 6 → 9 (or 1 → 2 → 6 → 9)
    ```

    **Example 2:**

    ```
    Input: matrix = [[3,4,5],[3,2,6],[2,2,1]]
    Output: 4
    Explanation: 3 → 4 → 5 → 6
    ```

    **Constraints:**

    - `m == matrix.length`
    - `n == matrix[i].length`
    - `1 <= m, n <= 200`
    - `0 <= matrix[i][j] <= 2³¹ - 1`
  solution: |
    func longestIncreasingPath(matrix [][]int) int {
        if len(matrix) == 0 {
            return 0
        }
        m, n := len(matrix), len(matrix[0])
        memo := make([][]int, m)
        for i := range memo {
            memo[i] = make([]int, n)
        }
        dirs := [][2]int{{1, 0}, {-1, 0}, {0, 1}, {0, -1}}
        var dfs func(int, int) int
        dfs = func(r, c int) int {
            if memo[r][c] > 0 {
                return memo[r][c]
            }
            best := 1
            for _, d := range dirs {
                nr, nc := r+d[0], c+d[1]
                if nr >= 0 && nr < m && nc >= 0 && nc < n && matrix[nr][nc] > matrix[r][c] {
                    cand := 1 + dfs(nr, nc)
                    if cand > best {
                        best = cand
                    }
                }
            }
            memo[r][c] = best
            return best
        }
        ans := 0
        for i := 0; i < m; i++ {
            for j := 0; j < n; j++ {
                cand := dfs(i, j)
                if cand > ans {
                    ans = cand
                }
            }
        }
        return ans
    }
- short_name: lru-cache
  title: LRU Cache
  difficulty: hard
  category: design
  frequency: common
  kind: lru-cache
  url: https://leetcode.com/problems/lru-cache/
  question_text: |
    Design a data structure that follows the constraints of a **Least Recently Used (LRU) cache**.

    Implement the `LRUCache` class:

    - `LRUCache(int capacity)` Initialize the LRU cache with **positive** size `capacity`.
    - `int get(int key)` Return the value of the `key` if the key exists, otherwise return `-1`.
    - `void put(int key, int value)` Update the value of the `key` if the `key` exists. Otherwise, add the key-value pair to the cache. If the number of keys exceeds the `capacity` from this operation, **evict** the least recently used key.

    The functions `get` and `put` must each run in O(1) average time complexity.

    **Example:**

    ```
    Input
    ["LRUCache", "put", "put", "get", "put", "get", "put", "get", "get", "get"]
    [[2], [1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]

    Output
    [null, null, null, 1, null, -1, null, -1, 3, 4]
    ```

    **Constraints:**

    - `1 <= capacity <= 3000`
    - `0 <= key <= 10^4`
    - `0 <= value <= 10^5`
    - At most `2 * 10^5` calls will be made to `get` and `put`.
  solution: |
    type LRUCache struct {
        cap  int
        m    map[int]*list.Element
        list *list.List
    }

    type entry struct {
        key   int
        value int
    }

    func Constructor(capacity int) LRUCache {
        return LRUCache{
            cap:  capacity,
            m:    make(map[int]*list.Element),
            list: list.New(),
        }
    }

    func (c *LRUCache) Get(key int) int {
        if el, ok := c.m[key]; ok {
            c.list.MoveToFront(el)
            return el.Value.(entry).value
        }
        return -1
    }

    func (c *LRUCache) Put(key int, value int) {
        if el, ok := c.m[key]; ok {
            el.Value = entry{key, value}
            c.list.MoveToFront(el)
            return
        }
        if c.list.Len() == c.cap {
            back := c.list.Back()
            delete(c.m, back.Value.(entry).key)
            c.list.Remove(back)
        }
        c.m[key] = c.list.PushFront(entry{key, value})
    }
- short_name: serialize-deserialize-binary-tree
  title: Serialize and Deserialize Binary Tree
  difficulty: hard
  category: trees
  frequency: common
  kind: codec-tree
  url: https://leetcode.com/problems/serialize-and-deserialize-binary-tree/
  question_text: |
    Serialization is the process of converting a data structure or object into a sequence of bits so that it can be stored in a file or memory buffer, or transmitted across a network connection link to be reconstructed later in the same or another computer environment.

    Design an algorithm to serialize and deserialize a binary tree. There is no restriction on how your serialization/deserialization algorithm should work. You just need to ensure that a binary tree can be serialized to a string and this string can be deserialized to the original tree structure.

    **Clarification:** The input/output format is the same as how LeetCode serializes a binary tree. You do not necessarily need to follow this format, so please be creative and come up with different approaches yourself.

    **Example 1:**

    ```
    Input: root = [1,2,3,null,null,4,5]
    Output: [1,2,3,null,null,4,5]
    ```

    **Example 2:**

    ```
    Input: root = []
    Output: []
    ```

    **Constraints:**

    - The number of nodes in the tree is in the range `[0, 10^4]`.
    - `-1000 <= Node.val <= 1000`
  solution: |
    type Codec struct{}

    func Constructor() Codec {
        return Codec{}
    }

    func (c *Codec) serialize(root *TreeNode) string {
        var b strings.Builder
        var preorder func(*TreeNode)
        preorder = func(n *TreeNode) {
            if n == nil {
                b.WriteString("null,")
                return
            }
            b.WriteString(fmt.Sprintf("%d,", n.Val))
            preorder(n.Left)
            preorder(n.Right)
        }
        preorder(root)
        return b.String()
    }

    func (c *Codec) deserialize(data string) *TreeNode {
        nodes := strings.Split(data, ",")
        i := 0
        var build func() *TreeNode
        build = func() *TreeNode {
            if nodes[i] == "null" {
                i++
                return nil
            }
            val, _ := strconv.Atoi(nodes[i])
            i++
            n := &TreeNode{Val: val}
            n.Left = build()
            n.Right = build()
            return n
        }
        return build()
    }
- short_name: evaluate-reverse-polish-notation
  title: Evaluate Reverse Polish Notation
  difficulty: medium
  category: stack
  frequency: uncommon
  signature: evalRPN(tokens []string) int
  url: https://leetcode.com/problems/evaluate-reverse-polish-notation/
  question_text: |
    Evaluate the value of an arithmetic expression in Reverse Polish
    Notation. Valid operators are `+`, `-`, `*`, and `/`. Each operand may
    be an integer or another expression. Division between two integers
    always truncates toward zero.

    **Example 1:**

    ```
    Input: tokens = ["2","1","+","3","*"]
    Output: 9
    Explanation: ((2 + 1) * 3) = 9
    ```

    **Example 2:**

    ```
    Input: tokens = ["4","13","5","/","+"]
    Output: 6
    Explanation: (4 + (13 / 5)) = 6
    ```

    **Constraints:**

    - `1 <= tokens.length <= 10^4`
    - `tokens[i]` is an operator (`+`, `-`, `*`, `/`) or an integer in range `[-200, 200]`
  solution: |
    func evalRPN(tokens []string) int {
        stack := make([]int, 0, len(tokens))
        for _, t := range tokens {
            switch t {
            case "+":
                stack[len(stack)-2] += stack[len(stack)-1]
                stack = stack[:len(stack)-1]
            case "-":
                stack[len(stack)-2] -= stack[len(stack)-1]
                stack = stack[:len(stack)-1]
            case "*":
                stack[len(stack)-2] *= stack[len(stack)-1]
                stack = stack[:len(stack)-1]
            case "/":
                stack[len(stack)-2] /= stack[len(stack)-1]
                stack = stack[:len(stack)-1]
            default:
                v, _ := strconv.Atoi(t)
                stack = append(stack, v)
            }
        }
        return stack[0]
    }
- short_name: find-duplicate-number
  title: Find the Duplicate Number
  difficulty: medium
  category: arrays
  frequency: common
  signature: findDuplicate(nums []int) int
  url: https://leetcode.com/problems/find-the-duplicate-number/
  question_text: |
    Given an array of integers `nums` containing `n + 1` integers where each
    integer is in the range `[1, n]` inclusive. There is only one repeated
    number in `nums`, return this repeated number. You must solve the
    problem without modifying the array and using O(1) extra space.

    **Example 1:**

    ```
    Input: nums = [1,3,4,2,2]
    Output: 2
    ```

    **Example 2:**

    ```
    Input: nums = [3,1,3,4,2]
    Output: 3
    ```

    **Constraints:**

    - `1 <= n <= 10^5`
    - `nums.length == n + 1`
    - `1 <= nums[i] <= n`
    - There is only one repeated number
  solution: |
    func findDuplicate(nums []int) int {
        slow, fast := nums[0], nums[nums[0]]
        for slow != fast {
            slow = nums[slow]
            fast = nums[nums[fast]]
        }
        slow = 0
        for slow != fast {
            slow = nums[slow]
            fast = nums[fast]
        }
        return slow
    }
- short_name: minimum-path-sum
  title: Minimum Path Sum
  difficulty: medium
  category: dynamic-programming
  frequency: uncommon
  signature: minPathSum(grid [][]int) int
  url: https://leetcode.com/problems/minimum-path-sum/
  question_text: |
    Given a `m x n` grid filled with non-negative numbers, find a path from
    top-left to bottom-right which minimises the sum of all numbers along
    the path. You can only move down or right at any point in time.

    **Example 1:**

    ```
    Input: grid = [[1,3,1],[1,5,1],[4,2,1]]
    Output: 7
    Explanation: 1 → 3 → 1 → 1 → 1
    ```

    **Example 2:**

    ```
    Input: grid = [[1,2,3],[4,5,6]]
    Output: 12
    ```

    **Constraints:**

    - `m == grid.length`
    - `n == grid[i].length`
    - `1 <= m, n <= 200`
    - `0 <= grid[i][j] <= 200`
  solution: |
    func minPathSum(grid [][]int) int {
        m, n := len(grid), len(grid[0])
        dp := make([][]int, m)
        for i := range dp {
            dp[i] = make([]int, n)
            for j := range dp[i] {
                if i == 0 && j == 0 {
                    dp[i][j] = grid[i][j]
                } else if i == 0 {
                    dp[i][j] = dp[i][j-1] + grid[i][j]
                } else if j == 0 {
                    dp[i][j] = dp[i-1][j] + grid[i][j]
                } else {
                    left, up := dp[i][j-1], dp[i-1][j]
                    if left < up {
                        dp[i][j] = left + grid[i][j]
                    } else {
                        dp[i][j] = up + grid[i][j]
                    }
                }
            }
        }
        return dp[m-1][n-1]
    }
- short_name: product-array-except-self
  title: Product of Array Except Self
  difficulty: medium
  category: arrays
  frequency: common
  signature: productExceptSelf(nums []int) []int
  url: https://leetcode.com/problems/product-of-array-except-self/
  question_text: |
    Given an integer array `nums`, return an array `answer` such that `answer[i]` is equal to the product of all the elements of `nums` except `nums[i]`.

    The product of any prefix or suffix of `nums` is guaranteed to fit in a 32-bit integer.

    You must write an algorithm that runs in O(n) time and without using the division operation.

    **Example 1:**

    ```
    Input: nums = [1,2,3,4]
    Output: [24,12,8,6]
    ```

    **Example 2:**

    ```
    Input: nums = [-1,1,0,-3,3]
    Output: [0,0,9,0,0]
    ```

    **Constraints:**

    - `2 <= nums.length <= 10^5`
    - `-30 <= nums[i] <= 30`
  solution: |
    func productExceptSelf(nums []int) []int {
        n := len(nums)
        ans := make([]int, n)
        for i := range ans {
            ans[i] = 1
        }
        prefix := 1
        for i := 0; i < n; i++ {
            ans[i] = prefix
            prefix *= nums[i]
        }
        suffix := 1
        for i := n - 1; i >= 0; i-- {
            ans[i] *= suffix
            suffix *= nums[i]
        }
        return ans
    }
- short_name: valid-parentheses
  title: Valid Parentheses
  difficulty: easy
  category: stack
  frequency: common
  signature: isValid(s string) bool
  url: https://leetcode.com/problems/valid-parentheses/
  question_text: |
    Given a string `s` containing just the characters `'('`, `')'`, `'{'`, `'}'`, `'['` and `']'`, determine if the input string is valid.

    An input string is valid if:

    1. Open brackets must be closed by the same type of brackets.
    2. Open brackets must be closed in the correct order.
    3. Every close bracket has a corresponding open bracket of the same type.

    **Example 1:**

    ```
    Input: s = "()"
    Output: true
    ```

    **Example 2:**

    ```
    Input: s = "()[]{}"
    Output: true
    ```

    **Example 3:**

    ```
    Input: s = "(]"
    Output: false
    ```

    **Constraints:**

    - `1 <= s.length <= 10^4`
    - `s` consists of parentheses only `'()[]{}'`.
  solution: |
    func isValid(s string) bool {
        stack := make([]byte, 0, len(s))
        for i := 0; i < len(s); i++ {
            switch s[i] {
            case '(', '{', '[':
                stack = append(stack, s[i])
            case ')':
                if len(stack) == 0 || stack[len(stack)-1] != '(' {
                    return false
                }
                stack = stack[:len(stack)-1]
            case '}':
                if len(stack) == 0 || stack[len(stack)-1] != '{' {
                    return false
                }
                stack = stack[:len(stack)-1]
            case ']':
                if len(stack) == 0 || stack[len(stack)-1] != '[' {
                    return false
                }
                stack = stack[:len(stack)-1]
            }
        }
        return len(stack) == 0
    }
- short_name: merge-two-sorted-lists
  title: Merge Two Sorted Lists
  difficulty: easy
  category: linked-list
  frequency: common
  kind: list
  signature: mergeTwoLists(list1 *ListNode, list2 *ListNode) *ListNode
  url: https://leetcode.com/problems/merge-two-sorted-lists/
  question_text: |
    You are given the heads of two sorted linked lists `list1` and `list2`.

    Merge the two lists into one sorted list. The list should be made by splicing together the nodes of the first two lists.

    Return the head of the merged linked list.

    **Example 1:**

    ```
    Input: list1 = [1,2,4], list2 = [1,3,4]
    Output: [1,1,2,3,4,4]
    ```

    **Example 2:**

    ```
    Input: list1 = [], list2 = []
    Output: []
    ```

    **Constraints:**

    - The number of nodes in both lists is in the range `[0, 50]`.
    - `-100 <= Node.val <= 100`
    - Both `list1` and `list2` are sorted in non-decreasing order.
  solution: |
    func mergeTwoLists(list1 *ListNode, list2 *ListNode) *ListNode {
        dummy := &ListNode{}
        cur := dummy
        for list1 != nil && list2 != nil {
            if list1.Val < list2.Val {
                cur.Next = list1
                list1 = list1.Next
            } else {
                cur.Next = list2
                list2 = list2.Next
            }
            cur = cur.Next
        }
        if list1 != nil {
            cur.Next = list1
        } else {
            cur.Next = list2
        }
        return dummy.Next
    }
- short_name: best-time-to-buy-and-sell-stock
  title: Best Time to Buy and Sell Stock
  difficulty: easy
  category: arrays
  frequency: common
  signature: maxProfit(prices []int) int
  url: https://leetcode.com/problems/best-time-to-buy-and-sell-stock/
  question_text: |
    You are given an array `prices` where `prices[i]` is the price of a given stock on the `i-th` day.

    You want to maximize your profit by choosing a single day to buy one stock and choosing a different day in the future to sell that stock.

    Return the maximum profit you can achieve from this transaction. If you cannot achieve any profit, return `0`.

    **Example 1:**

    ```
    Input: prices = [7,1,5,3,6,4]
    Output: 5
    Explanation: Buy on day 2 (price = 1) and sell on day 5 (price = 6), profit = 6-1 = 5.
    ```

    **Example 2:**

    ```
    Input: prices = [7,6,4,3,1]
    Output: 0
    ```

    **Constraints:**

    - `1 <= prices.length <= 10^5`
    - `0 <= prices[i] <= 10^4`
  solution: |
    func maxProfit(prices []int) int {
        minPrice := prices[0]
        maxProfit := 0
        for _, p := range prices {
            if p < minPrice {
                minPrice = p
            } else if p-minPrice > maxProfit {
                maxProfit = p - minPrice
            }
        }
        return maxProfit
    }
- short_name: climbing-stairs
  title: Climbing Stairs
  difficulty: easy
  category: dynamic-programming
  frequency: common
  signature: climbStairs(n int) int
  url: https://leetcode.com/problems/climbing-stairs/
  question_text: |
    You are climbing a staircase. It takes `n` steps to reach the top.

    Each time you can either climb 1 or 2 steps. In how many distinct ways can you climb to the top?

    **Example 1:**

    ```
    Input: n = 2
    Output: 2
    Explanation: There are two ways to climb to the top.
    1. 1 step + 1 step
    2. 2 steps
    ```

