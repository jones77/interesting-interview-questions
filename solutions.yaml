two-sum: |
  func twoSum(nums []int, target int) []int {
      m := make(map[int]int)
      for i, v := range nums {
          if j, ok := m[target-v]; ok {
              return []int{j, i}
          }
          m[v] = i
      }
      return nil
  }
fizzbuzz: |
  func fizzBuzz(n int) []string {
      ans := make([]string, n)
      for i := 1; i <= n; i++ {
          switch {
          case i%15 == 0:
              ans[i-1] = "FizzBuzz"
          case i%3 == 0:
              ans[i-1] = "Fizz"
          case i%5 == 0:
              ans[i-1] = "Buzz"
          default:
              ans[i-1] = strconv.Itoa(i)
          }
      }
      return ans
  }
reverse-string: |
  func reverseString(s []byte) {
      for i, j := 0, len(s)-1; i < j; i, j = i+1, j-1 {
          s[i], s[j] = s[j], s[i]
      }
  }
